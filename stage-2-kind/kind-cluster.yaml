kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: scrob-cluster

nodes:
  # Control-plane node
  - role: control-plane

    # Mark this node as ingress-ready.
    # This prepares it to host an ingress controller later.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    # Allow traffic from the host into the cluster.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP

      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Worker node 1
  - role: worker

  # Worker node 2
  - role: worker
